<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi rc</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: light dark; --line: #8886; --dim: #888; --code: #8881; }
body { margin: 0; font: 16px/1.45 system-ui, sans-serif; }
button, input, textarea { font: inherit; }
.app { display: grid; grid-template-columns: 11rem minmax(0, 1fr); height: 100dvh; }
aside { border-right: 1px solid var(--line); overflow: auto; padding: .6rem .5rem; font-size: .9rem; }
aside b { display: block; margin: 0 .3rem .5rem; }
aside a { display: block; padding: .35rem .3rem; color: inherit; text-decoration: none; border-radius: 4px; overflow-wrap: anywhere; }
aside a[aria-current] { background: var(--code); font-weight: 600; }
aside a.sub { margin-left: .8rem; font-size: .85rem; }
aside small { display: block; color: var(--dim); font-weight: normal; }
.empty { color: var(--dim); padding: .3rem; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { padding: .5rem .8rem; border-bottom: 1px solid var(--line); display: flex; gap: .6rem; align-items: baseline; }
header h1 { font-size: 1rem; margin: 0; flex: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header small { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
#back { display: none; }
#log { flex: 1; overflow: auto; padding: .4rem .8rem 1rem; }
.msg { margin: .9rem 0; max-width: 80ch; }
.msg.user { background: #168aa322; padding: .6rem .75rem; }
@media (prefers-color-scheme: dark) {
  .msg.user { background: #173e49; }
}
.who { font-size: .8rem; font-weight: 600; color: var(--dim); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: .45rem 0; }
.md ul, .md ol { padding-left: 1.3rem; }
.md h1, .md h2, .md h3, .md h4 { font-size: 1rem; margin: .8rem 0 .3rem; }
.md h1, .md h2 { font-size: 1.05rem; }
.md code { font-size: .85em; background: var(--code); padding: .05rem .25rem; border-radius: 3px; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); padding-left: .6rem; color: var(--dim); margin-left: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: .9rem; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: .25rem .5rem; text-align: left; }
.md th { color: var(--dim); }
.md [align=right] { text-align: right; font-variant-numeric: tabular-nums; } .md [align=center] { text-align: center; }
.md hr { border: 0; border-top: 1px solid var(--line); }
details { margin: .3rem 0; font-size: .9rem; }
summary { cursor: pointer; color: var(--dim); }
.label { margin-top: .9rem; }
.label + .msg, .label + .md, .label + .steps, .steps + .msg, .steps + .md { margin-top: .2rem; }
.steps { margin: .3rem 0 .6rem; }
.steps > summary { font-size: .85rem; }
.steps > details, .steps > .step { margin: .25rem 0 .25rem 1.1rem; }
.step summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .who { margin-top: .3rem; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--code); padding: .5rem; margin: .3rem 0; max-height: 20rem; overflow: auto; font-size: .8rem; }
footer { border-top: 1px solid var(--line); padding: .5rem .8rem; }
form { display: flex; gap: .4rem; }
textarea { flex: 1; min-height: 2.6rem; max-height: 10rem; resize: vertical; padding: .4rem; }
#attach { padding: 0 .6rem; }
#thumbs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .4rem; }
#thumbs:empty { display: none; }
#cmds { margin-bottom: .4rem; border: 1px solid var(--line); max-height: 14rem; overflow: auto; font-size: .9rem; }
#cmds:empty { display: none; }
#cmds button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: .35rem .5rem; cursor: pointer; color: inherit; }
#cmds button:hover, #cmds button:focus { background: var(--code); }
#cmds small { color: var(--dim); margin-left: .5rem; }
.choices button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; padding: .45rem .2rem; cursor: pointer; font: inherit; }
.choices button:hover { background: var(--code); }
.choices small { display: block; color: var(--dim); }
.notice { white-space: pre-wrap; font-size: .85rem; color: var(--dim); border-left: 2px solid var(--line); padding-left: .6rem; margin: .5rem 0; }
#thumbs span { position: relative; }
#thumbs img { height: 3.5rem; border-radius: 4px; border: 1px solid var(--line); display: block; }
#thumbs button { position: absolute; top: -.4rem; right: -.4rem; border-radius: 50%; width: 1.4rem; height: 1.4rem;
  padding: 0; line-height: 1; font-size: .8rem; }
#status { font-size: .8rem; color: var(--dim); margin-top: .3rem; min-height: 1.2em; }
#login { max-width: 24rem; margin: 20vh auto; padding: 1rem; }
#login input { width: 100%; padding: .4rem; margin: .5rem 0; }
aside b.sub { margin-top: 1.2rem; }
.host { display: flex; align-items: center; gap: .3rem; padding: .2rem .3rem; }
.host span { flex: 1; overflow-wrap: anywhere; }
.host button, #actions button, .row button { font-size: .8rem; padding: .15rem .45rem; }
#actions { margin-left: auto; display: flex; gap: .3rem; flex: none; }
.pane { flex: 1; overflow: auto; padding: .6rem .8rem 1rem; min-height: 0; }
.pane h2 { font-size: .85rem; color: var(--dim); margin: 1rem 0 .3rem; font-weight: 600; }
.pathrow { display: flex; gap: .4rem; }
.pathrow input { flex: 1; min-width: 0; padding: .4rem; }
#start { margin-top: .6rem; padding: .45rem .8rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; align-items: center; gap: .4rem; border-bottom: 1px solid var(--line); }
.row a { flex: 1; padding: .45rem .2rem; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
.row a:hover { background: var(--code); }
.row small { color: var(--dim); }
#pickstatus { margin-top: .5rem; color: var(--dim); font-size: .9rem; white-space: pre-wrap; }
#termbox { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #1d1f21; }
#term { flex: 1; min-height: 0; padding: .3rem; }
#keys { display: flex; gap: .3rem; padding: .3rem; overflow-x: auto; border-top: 1px solid var(--line); background: Canvas; }
#keys button { flex: none; min-width: 2.4rem; padding: .35rem .5rem; font-size: .85rem; }
#keys button[aria-pressed=true] { background: #168aa3; color: #fff; }
#notify { margin: 1.2rem .3rem 0; font-size: .8rem; padding: .15rem .45rem; }
#body { flex: 1; display: flex; min-height: 0; }
#body > #log { min-width: 0; }
#mons { flex: none; width: 16rem; border-left: 1px solid var(--line); overflow: auto; padding: .6rem; font-size: .85rem; }
.mon { border-bottom: 1px solid var(--line); padding: .4rem 0; }
.mon button { float: right; font-size: .75rem; padding: 0 .4rem; }
.mon small { display: block; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mon pre { font-size: .72rem; max-height: 8rem; margin: .3rem 0 0; }
#mons > summary { font-weight: 600; color: inherit; list-style: none; cursor: default; }
@media (max-width: 1000px) {
  #body { flex-direction: column-reverse; }
  #body > #log { flex: 1; }
  #mons { width: auto; max-height: 45vh; border-left: 0; border-bottom: 1px solid var(--line); padding: .4rem .8rem; }
  #mons > summary { cursor: pointer; list-style: revert; }
}
[hidden] { display: none !important; }
@media (max-width: 640px) {
  .app { grid-template-columns: 1fr; }
  .app.chat aside, .app:not(.chat) main { display: none; }
  aside { border-right: 0; font-size: 1rem; }
  aside a { padding: .6rem .3rem; border-bottom: 1px solid var(--line); border-radius: 0; }
  #back { display: inline; }
}
</style>
</head>
<body>
<form id="login" hidden>
  <b>pi rc</b>
  <input id="token" type="password" placeholder="relay token" autocomplete="current-password">
  <button>Connect</button>
</form>
<div class="app" id="app" hidden>
  <aside>
    <b>Sessions</b>
    <nav id="list"></nav>
    <b class="sub">Machines</b>
    <nav id="hosts"></nav>
    <button id="notify" type="button" hidden></button>
  </aside>
  <main>
    <header>
      <button id="back" type="button">‹</button>
      <h1 id="title">Pick a session</h1>
      <small id="where"></small>
      <span id="actions"></span>
    </header>
    <div id="body">
      <section id="log"></section>
      <details id="mons" hidden><summary></summary><div id="monlist"></div></details>
    </div>
    <section id="picker" class="pane" hidden>
      <div class="pathrow"><input id="path" placeholder="~/projects/app" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="go" type="button">Open</button></div>
      <button id="start" type="button">Start pi here</button>
      <div id="pickstatus"></div>
      <h2 id="recenth">Recent</h2>
      <div id="recent"></div>
      <h2>Folders</h2>
      <div id="dirs"></div>
    </section>
    <section id="termbox" hidden>
      <div id="term"></div>
      <div id="keys"></div>
    </section>
    <footer id="chatfoot">
      <div id="cmds"></div>
      <div id="thumbs"></div>
      <form id="composer">
        <button id="attach" type="button" title="Attach images" disabled>📎</button>
        <input id="file" type="file" accept="image/*" multiple hidden>
        <textarea id="text" placeholder="Message" disabled></textarea>
        <button id="send" disabled>Send</button>
        <button id="stop" type="button" hidden>Stop</button>
      </form>
      <div id="status"></div>
    </footer>
  </main>
</div>
<!-- Markdown for pi's replies. Pinned with integrity hashes; without them the page shows plain text. -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
  integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"
  onload="mdReady()"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
  integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"
  onload="mdReady()"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let token = '', ws = null, sessions = [], open = '', messages = [], partial = null, busy = false, activity = '';
let commands = [], follow = null; // slash commands the open session accepts (from its snapshot)
let retry = 1000;
let hosts = [], view = 'chat'; // view: 'chat' | 'picker' | 'term'
let pickHost = '', pickPath = '~', awaitSpawn = null, term = null;

// The token can come from the link (#token=...), so one bookmark is enough.
try {
  const h = new URLSearchParams(location.hash.slice(1)).get('token');
  if (h) { localStorage.setItem('pi-rc-token', h); history.replaceState(null, '', location.pathname); }
  token = localStorage.getItem('pi-rc-token') || '';
} catch (e) {}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function fold(label, text) {
  const d = el('details'); d.append(el('summary', label), el('pre', text)); return d;
}
// Text with http(s) links made clickable (built as DOM nodes, never as HTML).
function linked(text, cls) {
  const box = el('div', null, cls);
  let last = 0;
  for (const m of text.matchAll(/https?:\/\/[^\s<>"'`)\]]+/g)) {
    box.append(text.slice(last, m.index));
    const a = el('a', m[0]); a.href = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    box.append(a); last = m.index + m[0].length;
  }
  box.append(text.slice(last));
  return box;
}
// ---- desktop notifications: a session finished, and this tab isn't focused
const canNotify = 'Notification' in window && !matchMedia('(pointer: coarse)').matches; // phones need Web Push
const wasBusy = new Map(); // session id -> busy, to spot busy -> idle
let notifyOn = false;
try { notifyOn = localStorage.getItem('pi-rc-notify') === '1'; } catch (e) {}

function renderNotify() {
  const b = $('notify');
  b.hidden = !canNotify;
  if (!canNotify) return;
  const on = notifyOn && Notification.permission === 'granted';
  b.textContent = on ? '🔔 Notifications on' : Notification.permission === 'denied' ? '🔕 Blocked in browser' : '🔕 Notify when done';
  b.title = on ? 'You get a notification when a session finishes while this tab is in the background. Click to turn off.'
               : 'Get a notification when a session finishes while this tab is in the background';
}
$('notify').onclick = async () => {
  if (notifyOn && Notification.permission === 'granted') notifyOn = false;
  else notifyOn = (await Notification.requestPermission()) === 'granted';
  try { localStorage.setItem('pi-rc-notify', notifyOn ? '1' : '0'); } catch (e) {}
  renderNotify();
};

function checkFinished(list) {
  for (const s of list) {
    const before = wasBusy.get(s.id);
    wasBusy.set(s.id, s.busy);
    if (before && !s.busy) notifyDone(s);
  }
  for (const id of [...wasBusy.keys()]) if (!list.some(s => s.id === id)) wasBusy.delete(id);
}

function notifyDone(s) {
  if (!canNotify || !notifyOn || Notification.permission !== 'granted') return;
  if (!document.hidden && document.hasFocus()) return; // you're looking at it
  const name = s.name || s.cwd.split('/').pop() || 'session';
  let body = 'Finished · ' + s.machine + ':' + s.cwd;
  if (s.id === open) {
    // For the open session we have the reply: show its start.
    const last = [...messages].reverse().find(m => m.role === 'assistant');
    const text = last ? textOf(last.content).trim().replace(/\s+/g, ' ') : '';
    if (text) body = text.length > 140 ? text.slice(0, 140) + '…' : text;
  }
  try {
    const n = new Notification('pi · ' + name, {body, tag: 'pi-rc-' + s.id});
    n.onclick = () => { window.focus(); if (sessions.some(x => x.id === s.id) && open !== s.id) select(s.id); n.close(); };
  } catch (e) {}
}

function textOf(content) {
  if (typeof content === 'string') return content;
  return (content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
}

// ---- markdown (pi's replies only)
let mdOn = false;
function mdReady() {
  if (mdOn || !window.marked || !window.DOMPurify) return;
  DOMPurify.addHook('afterSanitizeAttributes', node => {
    if (node.tagName === 'A') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
  });
  mdOn = true;
  if (typeof renderLog === 'function') renderLog();
}
function md(text) {
  if (!mdOn) return linked(text, 'text');
  const box = el('div', null, 'md');
  // The page holds the relay token, so model output is always sanitized. Images are
  // dropped: a tricked model could otherwise leak data through an image URL.
  box.innerHTML = DOMPurify.sanitize(marked.parse(text, {gfm: true, breaks: true}), {
    FORBID_TAGS: ['img', 'style', 'form', 'input', 'button', 'textarea', 'select', 'iframe', 'object', 'embed', 'video', 'audio', 'source', 'picture', 'svg', 'math'],
    FORBID_ATTR: ['style', 'srcset'],
    ALLOWED_URI_REGEXP: /^(?:https?:|mailto:|#)/i,
  });
  return box;
}

// ---- transcript: replies stay visible; tool calls, results and thinking between
// them fold into one "N steps" group, like Claude's UI.
function pageLink(url) {
  const box = el('div', null, 'msg');
  const a = el('a', '↗ open page'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  box.append(a, el('small', ' ' + url.replace(/^https?:\/\//, ''), 'who'));
  return box;
}
function brief(args) {
  const v = args && (args.command || args.path || args.file_path || args.pattern || args.query || args.url);
  return v ? String(v).replace(/\s+/g, ' ').slice(0, 70) : '';
}
function callStep(b, r) {
  const d = el('details', null, 'step');
  const mark = !r ? '… ' : r.isError ? '✗ ' : '';
  d.append(el('summary', mark + b.name + (brief(b.arguments) ? '  ' + brief(b.arguments) : '')));
  d.append(el('div', 'input', 'who'), el('pre', JSON.stringify(b.arguments, null, 2)));
  if (r) d.append(el('div', r.isError ? 'error' : 'result', 'who'), el('pre', textOf(r.content) || '(empty)'));
  return d;
}
function renderLog() {
  const log = $('log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
  const openKeys = new Set([...log.querySelectorAll('details[open]')].map(d => d.dataset.k));
  const all = [...messages, ...(partial ? [partial] : [])];
  const results = new Map(), callIds = new Set();
  for (const m of all) {
    if (m.role === 'toolResult') results.set(m.toolCallId, m);
    if (m.role === 'assistant' && Array.isArray(m.content)) for (const b of m.content) if (b.type === 'toolCall') callIds.add(b.id);
  }
  const frag = document.createDocumentFragment();
  let group = null, who = '';
  const say = (label, node) => {
    if (label && who !== label) { frag.append(el('div', label, 'who label')); who = label; }
    frag.append(node);
  };
  const flush = () => {
    if (!group) return;
    const g = el('details', null, 'steps'); g.dataset.k = group.key;
    const names = [...new Set(group.names)];
    const running = group.open && busy;
    g.append(el('summary', (running ? 'working · ' : '') + group.items.length + (group.items.length === 1 ? ' step' : ' steps') +
      (names.length ? ' · ' + names.slice(0, 4).join(', ') + (names.length > 4 ? ', …' : '') : '')));
    group.items.forEach((d, n) => { d.dataset.k = group.key + ':' + n; d.open = openKeys.has(d.dataset.k); g.append(d); });
    g.open = openKeys.has(group.key);
    say('pi', g);
    group = null;
  };
  const step = (key, node, name) => {
    if (!group) group = {key: 'g' + key, items: [], names: [], open: false};
    group.items.push(node);
    if (name) group.names.push(name);
  };
  all.forEach((m, i) => {
    if (m.role === 'user') {
      flush(); who = '';
      const box = el('div', null, 'msg user');
      box.append(el('div', 'you', 'who'), linked(textOf(m.content), 'text'));
      frag.append(box);
    } else if (m.role === 'assistant') {
      const blocks = typeof m.content === 'string' ? [{type: 'text', text: m.content}] : m.content || [];
      for (const b of blocks) {
        if (b.type === 'text' && b.text) { flush(); say('pi', Object.assign(md(b.text), {className: (mdOn ? 'md' : 'text') + ' msg'})); }
        else if (b.type === 'thinking' && b.thinking) step(i, fold('thinking', b.thinking), 'thinking');
        else if (b.type === 'toolCall') step(i, callStep(b, results.get(b.id)), b.name);
      }
      if (m.errorMessage) { flush(); say('pi', el('div', m.errorMessage, 'text msg')); }
    } else if (m.role === 'toolResult') {
      const url = m.toolName === 'publish_page' && !m.isError && (textOf(m.content).match(/https?:\/\/\S+/) || [])[0];
      if (url) { flush(); say('pi', pageLink(url)); }
      else if (!callIds.has(m.toolCallId)) step(i, fold((m.isError ? '✗ ' : '↳ ') + (m.toolName || 'result'), textOf(m.content)), m.toolName);
    } else if (m.role === 'choices') {
      flush(); who = '';
      const box = el('div', null, 'notice choices');
      box.append(el('div', m.title));
      for (const it of m.items) {
        const b = el('button', String(it.label || it.value)); b.type = 'button';
        if (it.detail) b.append(el('small', String(it.detail)));
        b.onclick = () => send({type: 'prompt', id: open, text: m.command + ' ' + it.value});
        box.append(b);
      }
      frag.append(box);
    } else if (m.role === 'notice') {
      flush(); who = '';
      frag.append(el('div', m.text, 'notice'));
    } else if (m.role === 'bashExecution') {
      flush(); who = '';
      frag.append(fold('$ ' + (m.command || ''), m.output || ''));
    } else if (!(m.role === 'custom' && m.display === false)) {
      const t = textOf(m.content) || m.summary;
      if (t) { flush(); who = ''; const box = el('div', null, 'msg'); box.append(el('div', m.customType || m.role, 'who'), el('div', t, 'text')); frag.append(box); }
    }
  });
  if (group) group.open = true; // the trailing group is the one pi is working in
  flush();
  log.replaceChildren(frag);
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function renderList() {
  const list = $('list');
  list.replaceChildren();
  if (!sessions.length) list.append(el('div', 'No pi sessions connected.', 'empty'));
  // Subagents go right under the session that started them, indented.
  const ids = new Set(sessions.map(s => s.id));
  const top = sessions.filter(s => !ids.has(s.parent));
  const ordered = top.flatMap(t => [t, ...sessions.filter(s => s.parent === t.id)]);
  for (const s of ordered) {
    const a = el('a', (s.busy ? '● ' : '') + (s.name || s.cwd.split('/').pop() || 'session'));
    if (ids.has(s.parent)) a.className = 'sub';
    a.href = '#';
    a.append(el('small', s.machine));
    if (s.id === open) a.setAttribute('aria-current', 'true');
    a.onclick = ev => { ev.preventDefault(); select(s.id); };
    list.append(a);
  }
  const hl = $('hosts');
  hl.replaceChildren();
  if (!hosts.length) hl.append(el('div', 'No daemons online. In pi: /rc daemon on', 'empty'));
  for (const h of hosts) {
    const row = el('div', null, 'host');
    row.append(el('span', h.machine));
    if (h.caps.includes('spawn')) { const b = el('button', '+ pi'); b.type = 'button'; b.title = 'Start pi in a folder'; b.onclick = () => openPicker(h.machine); row.append(b); }
    if (h.caps.includes('terminal')) { const b = el('button', '>_'); b.type = 'button'; b.title = 'Terminal'; b.onclick = () => openTerm(h.machine, {}); row.append(b); }
    hl.append(row);
  }
  const s = sessions.find(x => x.id === open);
  if (s) busy = s.busy;
  if (s && view === 'chat') {
    $('title').textContent = s.name || 'session'; $('where').textContent = '\u2066' + s.machine + ':' + s.cwd + '\u2069';
    const acts = [];
    if (s.tmux && hostCan(s.machine, 'terminal')) {
      const b = el('button', '>_'); b.type = 'button'; b.title = 'Open its terminal (tmux ' + s.tmux + ')';
      b.onclick = () => openTerm(s.machine, {tmux: s.tmux, title: s.name || s.tmux}); acts.push(b);
    }
    if (s.own && hostCan(s.machine, 'spawn')) {
      const b = el('button', 'End'); b.type = 'button'; b.title = 'Quit this pi (kills its tmux session)';
      b.onclick = () => { if (confirm('End "' + (s.name || s.tmux) + '"? pi quits and its tmux session closes.')) hostReq(s.machine, 'kill', {tmux: s.tmux}).catch(e => alert(e.message)); };
      acts.push(b);
    }
    $('actions').replaceChildren(...acts);
  }
  controls();
}
function hostCan(machine, cap) { return hosts.some(h => h.machine === machine && h.caps.includes(cap)); }

function controls() {
  const live = !!sessions.find(x => x.id === open);
  $('text').disabled = $('send').disabled = $('attach').disabled = !live;
  $('stop').hidden = !(live && busy);
  $('status').textContent = !open ? '' : !live ? 'Session not connected (pi closed or laptop offline).' :
    busy ? (activity || 'working…') : touch() ? '' : 'Enter sends · Shift+Enter new line';
}

function show(v) {
  if (view === 'term' && v !== 'term') closeTerm();
  view = v;
  $('body').hidden = $('chatfoot').hidden = v !== 'chat';
  $('picker').hidden = v !== 'picker';
  $('termbox').hidden = v !== 'term';
  $('actions').replaceChildren();
  $('app').classList.add('chat');
}

function select(id) {
  show('chat');
  open = id; messages = []; partial = null; activity = ''; monitors = []; renderMonitors();
  $('app').classList.add('chat');
  renderLog(); renderList();
  send({type: 'open', id});
}

// ---- monitors: the open session's background commands, in a right column
let monitors = [];
function renderMonitors() {
  // A column on wide screens; on phones a bar above the chat that opens on tap.
  const box = $('mons'), wide = matchMedia('(min-width: 1001px)').matches;
  if (!monitors.length) box.hidden = true;
  else if (box.hidden) { box.hidden = false; box.open = wide; }
  if (wide) box.open = true;
  const running = monitors.filter(m => m.status === 'running');
  box.firstChild.textContent = 'Monitors \u00b7 ' + (running.length ? running.length + ' running' : 'none running') +
    (box.open || !running.length ? '' : ': ' + running.map(m => m.name).join(', '));
  $('monlist').replaceChildren(...monitors.map(m => {
    const card = el('div', null, 'mon'), b = el('button', m.status === 'running' ? 'Stop' : '\u00d7');
    b.type = 'button'; b.onclick = () => send({type: 'prompt', id: open, text: '/monitor stop ' + m.id});
    const state = m.status === 'exited' ? 'exit ' + m.code : m.status;
    card.append(b, el('div', (m.status === 'running' ? '\u25cf ' : '') + m.name), el('small', m.id + ' \u00b7 ' + state + ' \u00b7 $ ' + m.command));
    if (m.lines.length) card.append(el('pre', m.lines.join('\n')));
    return card;
  }));
}

$('mons').ontoggle = () => renderMonitors();

function touch() { return matchMedia('(pointer: coarse)').matches; }
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

function onEvent(ev) {
  if (ev.type === 'message_start' && ev.message.role === 'assistant') partial = ev.message;
  else if (ev.type === 'message_update') partial = ev.message;
  else if (ev.type === 'message_end') {
    if (ev.message.role === 'assistant') partial = null;
    messages.push(ev.message);
  } else if (ev.type === 'busy') { busy = ev.busy; if (!busy) { activity = ''; partial = null; } }
  else if (ev.type === 'activity') activity = ev.text || '';
  else if (ev.type === 'monitors') { monitors = Array.isArray(ev.monitors) ? ev.monitors : []; renderMonitors(); return; }
  else if (ev.type === 'notice') messages.push({role: 'notice', text: String(ev.text || '')}); // shown here only, not saved
  else if (ev.type === 'choices') messages.push({role: 'choices', title: String(ev.title || ''), command: String(ev.command || ''), items: Array.isArray(ev.items) ? ev.items : []});
  renderLog(); controls();
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/viewer?token=' + encodeURIComponent(token));
  let opened = false;
  ws.onopen = () => {
    opened = true; retry = 1000;
    $('login').hidden = true; $('app').hidden = false;
    if (open) send({type: 'open', id: open});
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'hosts') { hosts = m.hosts || []; renderList(); return; }
    if (m.type === 'res') { const f = waiting.get(m.req); if (f) { waiting.delete(m.req); f(m); } return; }
    if (m.type === 'term' || m.type === 'term_exit') { onTerm(m); return; }
    if (m.type === 'sessions') {
      // pi replaced the open session (/new, /resume, /reload): follow it to the new one.
      const gone = open && !m.sessions.some(s => s.id === open);
      const cur = sessions.find(s => s.id === open);
      if (gone && cur) follow = {machine: cur.machine, cwd: cur.cwd, until: Date.now() + 15000};
      sessions = m.sessions; renderList(); checkFinished(sessions);
      // A session started from the web: open it as soon as it connects.
      if (awaitSpawn) {
        const s = sessions.find(x => x.spawn === awaitSpawn.id);
        if (s) { awaitSpawn = null; select(s.id); }
        else if (Date.now() > awaitSpawn.until) { awaitSpawn = null; $('pickstatus').textContent = 'pi started in tmux but has not connected. Is the rc extension installed there?'; }
      }
      if (follow && !sessions.some(s => s.id === open) && Date.now() < follow.until) {
        const next = sessions.find(s => s.machine === follow.machine && s.cwd === follow.cwd);
        if (next) { follow = null; select(next.id); }
      }
    }
    else if (m.id !== open) return;
    else if (m.type === 'snapshot') { messages = m.data.messages || []; partial = m.data.partial || null; commands = m.data.commands || []; busy = !!m.data.busy; monitors = m.data.monitors || []; renderMonitors(); renderLog(); controls(); }
    else if (m.type === 'event') onEvent(m.event);
    else if (m.type === 'gone') {
      const was = sessions.find(s => s.id === m.id);
      if (was) follow = {machine: was.machine, cwd: was.cwd, until: Date.now() + 15000};
      sessions = sessions.filter(s => s.id !== m.id); renderList();
    }
  };
  ws.onclose = () => {
    if (!opened && retry === 1000) {
      // Never connected: most likely a wrong token.
      $('app').hidden = true; $('login').hidden = false;
      $('token').value = ''; $('token').placeholder = 'relay token (the last one did not work)';
      return;
    }
    $('status').textContent = 'Reconnecting…';
    setTimeout(connect, retry); retry = Math.min(retry * 2, 15000);
  };
}

renderNotify();

$('login').onsubmit = ev => {
  ev.preventDefault();
  token = $('token').value.trim();
  try { localStorage.setItem('pi-rc-token', token); } catch (e) {}
  retry = 1000; connect();
};
// ---- images: paste, pick or drop; shrunk in the browser before sending
let pending = [];   // {data (base64), mimeType, url}
const MAX_SIDE = 1568, BUDGET = 700_000; // base64 bytes per message, under the relay's limit

async function shrink(file, quality) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); // transparent PNGs get a white background
  g.drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', quality);
  return {data: url.slice(url.indexOf(',') + 1), mimeType: 'image/jpeg', url, file};
}
async function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/') || pending.length >= 8) continue;
    try { pending.push(await shrink(f, 0.85)); } catch (e) { $('status').textContent = 'Could not read that image.'; }
  }
  renderThumbs();
}
function renderThumbs() {
  $('thumbs').replaceChildren(...pending.map((p, i) => {
    const s = el('span'), img = el('img'), x = el('button', '×');
    img.src = p.url; x.type = 'button'; x.title = 'Remove';
    x.onclick = () => { pending.splice(i, 1); renderThumbs(); };
    s.append(img, x); return s;
  }));
}
async function fitBudget() {
  // Re-encode smaller until everything fits in one message.
  for (const q of [0.7, 0.55, 0.4]) {
    if (pending.reduce((n, p) => n + p.data.length, 0) <= BUDGET) return true;
    pending = await Promise.all(pending.map(p => shrink(p.file, q)));
  }
  return pending.reduce((n, p) => n + p.data.length, 0) <= BUDGET;
}
$('attach').onclick = () => $('file').click();
$('file').onchange = () => { addFiles([...$('file').files]); $('file').value = ''; };
$('text').addEventListener('paste', ev => {
  const files = [...(ev.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) { ev.preventDefault(); addFiles(files); }
});
$('log').addEventListener('dragover', ev => ev.preventDefault());
$('log').addEventListener('drop', ev => { ev.preventDefault(); addFiles([...ev.dataTransfer.files]); });

// ---- "/" suggestions
function renderCmds() {
  const v = $('text').value;
  const m = v.match(/^\/([\w:.-]*)$/);
  if (!m || !commands.length) return $('cmds').replaceChildren();
  const q = m[1].toLowerCase();
  const hits = commands.filter(c => c.name.toLowerCase().startsWith(q)).slice(0, 12);
  $('cmds').replaceChildren(...hits.map(c => {
    const b = el('button', '/' + c.name); b.type = 'button';
    if (c.description) b.append(el('small', c.description));
    b.onclick = () => { $('text').value = '/' + c.name + ' '; renderCmds(); $('text').focus(); };
    return b;
  }));
}
$('text').addEventListener('input', renderCmds);

$('composer').onsubmit = async ev => {
  ev.preventDefault();
  const text = $('text').value.trim();
  if ((!text && !pending.length) || !open) return;
  const session = sessions.find(s => s.id === open);
  if (pending.length && !(session?.caps || []).includes('images')) {
    $('status').textContent = 'pi on ' + session?.machine + ' has an older rc extension that drops images. ' +
      'There, run: pi update --extensions, then restart pi.';
    return;
  }
  if (pending.length && !(await fitBudget())) {
    $('status').textContent = 'Images are too large together; send fewer at once.';
    return;
  }
  send({type: 'prompt', id: open, text, images: pending.map(p => ({data: p.data, mimeType: p.mimeType}))});
  $('text').value = ''; pending = []; renderThumbs(); renderCmds();
};
$('text').onkeydown = ev => {
  // On phones Enter stays a newline; the Send button sends.
  if (ev.key === 'Enter' && !ev.shiftKey && !touch()) {
    ev.preventDefault(); $('composer').requestSubmit();
  }
};
$('stop').onclick = () => send({type: 'abort', id: open});
$('back').onclick = () => { if (view === 'term') show('chat'); $('app').classList.remove('chat'); };

// ---- machines: requests to a machine's pi rc daemon
let reqN = 0;
const waiting = new Map();
function hostReq(machine, op, args) {
  return new Promise((res, rej) => {
    const req = 'r' + (++reqN);
    waiting.set(req, m => m.error ? rej(new Error(m.error)) : res(m));
    setTimeout(() => { if (waiting.delete(req)) rej(new Error('No answer from ' + machine + '.')); }, 30000);
    send(Object.assign({type: 'host_req', machine, req, op}, args));
  });
}
const rid = () => Math.random().toString(36).slice(2, 10);

// ---- new session: pick a folder
function openPicker(machine) {
  show('picker');
  pickHost = machine;
  $('title').textContent = 'New pi session'; $('where').textContent = machine;
  $('pickstatus').textContent = '';
  hostReq(machine, 'recent', {}).then(r => {
    $('recenth').hidden = !r.dirs.length;
    $('recent').replaceChildren(...r.dirs.map(d => folderRow(d.path, d.path, true)));
  }).catch(e => { $('pickstatus').textContent = e.message; });
  browse('~');
}
function folderRow(label, path, startable) {
  const row = el('div', null, 'row'), a = el('a', label);
  a.href = '#'; a.onclick = ev => { ev.preventDefault(); browse(path); };
  row.append(a);
  if (startable) { const b = el('button', 'Start'); b.type = 'button'; b.onclick = () => startIn(path); row.append(b); }
  return row;
}
function browse(path) {
  hostReq(pickHost, 'dirs', {path}).then(r => {
    pickPath = r.path; $('path').value = r.path;
    $('start').textContent = 'Start pi in ' + r.path;
    const rows = [];
    if (r.parent) rows.push(folderRow('‹ ' + r.parent, r.parent));
    for (const d of r.dirs) rows.push(folderRow(d + '/', (r.path === '/' ? '' : r.path) + '/' + d));
    if (!r.dirs.length) rows.push(el('div', 'No folders here.', 'empty'));
    $('dirs').replaceChildren(...rows);
  }).catch(e => { $('pickstatus').textContent = e.message; });
}
function startIn(path) {
  const id = rid();
  $('pickstatus').textContent = 'Starting pi in ' + path + '…';
  hostReq(pickHost, 'spawn', {path, spawn: id}).then(r => {
    $('pickstatus').textContent = 'Started (tmux ' + r.tmux + '). Waiting for it to connect…';
    awaitSpawn = {id, until: Date.now() + 20000};
    const s = sessions.find(x => x.spawn === id);
    if (s) { awaitSpawn = null; select(s.id); }
  }).catch(e => { $('pickstatus').textContent = e.message; });
}
$('go').onclick = () => browse($('path').value.trim() || '~');
$('path').onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); browse($('path').value.trim() || '~'); } };
$('start').onclick = () => startIn(pickPath);

// ---- terminals (xterm.js, loaded on first use; pinned with integrity hashes)
let xtermP = null;
function loadXterm() {
  const add = (tag, attrs) => new Promise((ok, bad) => {
    const n = Object.assign(document.createElement(tag), attrs, {crossOrigin: 'anonymous'});
    n.onload = ok; n.onerror = () => bad(new Error('Could not load the terminal (xterm.js).'));
    document.head.append(n);
  });
  xtermP ??= Promise.all([
    add('link', {rel: 'stylesheet', href: 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css',
      integrity: 'sha384-8Xk9wy/gzEDUKrXtrmCFa2bBuK3BpjpDuL/p0SeKQX19Khl/M+lHOgD/CyYf7efP'}),
    add('script', {src: 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js',
      integrity: 'sha384-M169f14mRZOXm3hD/v2Ti0ThIT/RnAQagXA9nlE15yHAtrW19gdePJh/HaTzUOe/'})
      .then(() => add('script', {src: 'https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js',
        integrity: 'sha384-iF+jqbuti4XlB64clWgFWYEscb+UnSRv3VgVikGYZu+otNFnSHr7y7NcKfBnGizn'})),
  ]).catch(e => { xtermP = null; throw e; });
  return xtermP;
}
// Keys phone keyboards lack. Ctrl is sticky: tap it, then a letter.
const KEYS = [['Esc', '\x1b'], ['Tab', '\t'], ['Ctrl', null], ['^C', '\x03'], ['↑', '\x1b[A'], ['↓', '\x1b[B'], ['←', '\x1b[D'], ['→', '\x1b[C'], ['^D', '\x04'], ['|', '|'], ['~', '~'], ['/', '/']];
let ctrl = false;
$('keys').replaceChildren(...KEYS.map(([label, seq]) => {
  const b = el('button', label); b.type = 'button';
  b.onmousedown = ev => ev.preventDefault(); // keep the keyboard up
  b.onclick = () => {
    if (!term) return;
    if (seq === null) { ctrl = !ctrl; b.setAttribute('aria-pressed', String(ctrl)); }
    else termInput(seq);
    term.x.focus();
  };
  return b;
}));
function termInput(d) {
  if (ctrl && d.length === 1) {
    ctrl = false; $('keys').querySelector('[aria-pressed]')?.removeAttribute('aria-pressed');
    const c = d.toLowerCase().charCodeAt(0);
    if (c >= 97 && c <= 122) d = String.fromCharCode(c - 96);
  }
  send({type: 'term_in', machine: term.machine, tid: term.tid, data: d});
}
async function openTerm(machine, opts) {
  show('term');
  $('title').textContent = opts.title || 'Terminal'; $('where').textContent = machine + (opts.tmux ? ' · tmux ' + opts.tmux : '');
  $('term').replaceChildren(el('div', 'Loading…', 'empty'));
  try { await loadXterm(); } catch (e) { $('term').replaceChildren(el('div', e.message, 'empty')); return; }
  if (view !== 'term') return;
  $('term').replaceChildren();
  const x = new Terminal({cursorBlink: true, fontSize: touch() ? 12 : 14, scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', theme: {background: '#1d1f21'}});
  const fit = new FitAddon.FitAddon();
  x.loadAddon(fit); x.open($('term')); fit.fit();
  const t = term = {machine, tid: rid(), x, fit, ro: null, ended: false};
  x.onData(termInput);
  t.ro = new ResizeObserver(() => {
    if (term !== t) return;
    fit.fit(); send({type: 'term_resize', machine, tid: t.tid, cols: x.cols, rows: x.rows});
  });
  t.ro.observe($('term'));
  try {
    await hostReq(machine, 'term_open', {tid: t.tid, cols: x.cols, rows: x.rows, tmux: opts.tmux || '', path: opts.path || ''});
    x.focus();
  } catch (e) { x.write('\r\n\x1b[31m' + e.message + '\x1b[0m\r\n'); t.ended = true; }
}
function onTerm(m) {
  if (!term || m.tid !== term.tid) return;
  if (m.type === 'term') term.x.write(Uint8Array.from(atob(m.data), c => c.charCodeAt(0)));
  else { term.ended = true; term.x.write('\r\n\x1b[2m[ended]\x1b[0m\r\n'); }
}
function closeTerm() {
  if (!term) return;
  if (!term.ended) send({type: 'term_close', machine: term.machine, tid: term.tid});
  term.ro?.disconnect(); term.x.dispose(); term = null;
}
setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 30000);

if (token) connect(); else $('login').hidden = false;
</script>
